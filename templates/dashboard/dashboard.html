{% extends "base.html" %}

{% load static %}

{% block title %}
Dashboard
{% endblock %}

{% block content %}

<div class="container">

    <h2 class="mb-4">

        Architecture Review Dashboard

    </h2>

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <table class="table table-borderless">

                <tr>
                    <td><strong>Total Reviews</strong></td>
                    <td id="total-reviews">0</td>
                </tr>

                <tr>
                    <td><strong>Average Score</strong></td>
                    <td id="average-score">0</td>
                </tr>

                <tr>
                    <td><strong>Latest Review</strong></td>
                    <td id="latest-review">-</td>
                </tr>

            </table>

        </div>

    </div>

    <div class="d-flex gap-3">

        <a
            href="/review/new/"
            class="btn btn-primary"
        >
            Start Review
        </a>

        <a
            href="/history/"
            class="btn btn-outline-primary"
        >
            View History
        </a>

    </div>

</div>

<script src="{% static 'js/dashboard.js' %}"></script>

{% endblock %}
