{% extends "base.html" %}
{% load static %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-body">

                <h3 class="text-center mb-4">
                    Login
                </h3>
                <div id="session-message" class="mb-3"></div>

                <form onsubmit="loginUser(event)">

                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input
                            id="username"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            id="password"
                            type="password"
                            class="form-control"
                            required
                        >

                    </div>

                    <button
                        class="btn btn-success w-100"
                    >
                        Login
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>



{% endblock %}
